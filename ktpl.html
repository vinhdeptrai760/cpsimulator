    // Hàm xáo trộn mảng (Shuffle Array)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // HÀM RENDER CODE TỰ ĐỘNG TỪ DỮ LIỆU JSON
    function renderTabs() {
        const labels = ['A', 'B', 'C', 'D'];
        Object.keys(data).forEach(tabId => {
            const container = document.getElementById(`quiz-${tabId}`);
            let html = "";
            const sections = { mc: "I. TRẮC NGHIỆM CHỌN 1 ĐÁP ÁN", rc: "II. CÂU HỎI ĐỌC HIỂU TÌNH HUỐNG", tf: "III. CÂU HỎI ĐÚNG / SAI" };
            
            Object.keys(data[tabId]).forEach(secKey => {
                if(data[tabId][secKey] && data[tabId][secKey].length > 0) {
                    html += `<div class="section-title">${sections[secKey]}</div>`;
                    
                    // Xáo trộn mảng câu hỏi trước khi in ra HTML
                    shuffleArray(data[tabId][secKey]);

                    data[tabId][secKey].forEach((item, index) => {
                        html += `<div class="question-block" id="qblock-${tabId}-${secKey}-${index}">
                                    <div class="question-title">Câu ${index + 1}: ${item.q}</div><ul class="options">`;
                        
                        if(secKey === 'tf') {
                            ['Đúng', 'Sai'].forEach(opt => {
                                let val = opt === 'Đúng' ? 'Đ' : 'S';
                                html += `<li><label><input type="radio" name="q-${tabId}-${secKey}-${index}" value="${val}"> Chọn ${opt}</label></li>`;
                            });
                        } else {
                            item.opts.forEach((optText, optIndex) => {
                                html += `<li><label><input type="radio" name="q-${tabId}-${secKey}-${index}" value="${optIndex}"> <b>${labels[optIndex]}.</b> ${optText}</label></li>`;
                            });
                        }
                        
                        let correctTextDisplay = "";
                        if(secKey === 'tf') {
                            correctTextDisplay = item.ans === 'Đ' ? 'ĐÚNG' : 'SAI';
                        } else {
                            correctTextDisplay = `${labels[item.ans]}`;
                        }

                        html += `</ul>
                                <div class="correct-text" id="correct-${tabId}-${secKey}-${index}">✔️ Chính xác!</div>
                                <div class="wrong-text" id="wrong-${tabId}-${secKey}-${index}">❌ Sai rồi. Đáp án đúng là: <b>${correctTextDisplay}</b></div>
                                </div>`;
                    });
                }
            });
            container.innerHTML = html;
        });
    }

    // HÀM CHUYỂN TAB CHUYÊN DỤNG
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`content-${tabId}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // HÀM CHẤM ĐIỂM
    function submitQuiz(tabId) {
        let score = 0, total = 0;
        ['mc', 'rc', 'tf'].forEach(secKey => {
            if(data[tabId][secKey]) {
                data[tabId][secKey].forEach((item, index) => {
                    total++;
                    const selected = document.querySelector(`input[name="q-${tabId}-${secKey}-${index}"]:checked`);
                    const block = document.getElementById(`qblock-${tabId}-${secKey}-${index}`);
                    document.querySelectorAll(`input[name="q-${tabId}-${secKey}-${index}"]`).forEach(inp => inp.disabled = true);
                    
                    let isCorrect = false;
                    if (selected) {
                        if (secKey === 'tf') {
                            isCorrect = (selected.value === item.ans);
                        } else {
                            isCorrect = (parseInt(selected.value) === item.ans);
                        }
                    }

                    if(isCorrect) {
                        score++; 
                        block.style.borderLeftColor = "#15803d";
                        document.getElementById(`correct-${tabId}-${secKey}-${index}`).style.display = "block";
                    } else {
                        block.style.borderLeftColor = "#b91c1c";
                        document.getElementById(`wrong-${tabId}-${secKey}-${index}`).style.display = "block";
                    }
                });
            }
        });

        const resBox = document.getElementById(`result-${tabId}`);
        resBox.style.display = 'block';
        resBox.innerHTML = `Tổng kết: Bạn đạt ${score} / ${total} điểm.`;
        resBox.style.backgroundColor = (score === total) ? '#dcfce7' : '#fee2e2';
        resBox.style.color = (score === total) ? '#166534' : '#991b1b';
        
        event.currentTarget.style.display = "none";
    }

    // Khởi chạy khi load xong HTML
    window.onload = renderTabs;
</script>
